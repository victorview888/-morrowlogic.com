name: Website checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check generated pages are committed
        run: git diff --exit-code -- index.html pages/privacy.html zh-CN sitemap.xml
      - run: npx playwright install --with-deps chromium
      - run: npm test
